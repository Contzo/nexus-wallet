<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="#08090b"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="url(#bg_grad)" fill-opacity="0.18"/>
  <rect x="4" y="4" width="504" height="504" rx="108" stroke="#2b2f38" stroke-width="8"/>

  <!-- Nexus motif — two overlapping circles -->
  <circle cx="191" cy="256" r="116" stroke="#86d9c6" stroke-width="20"/>
  <circle cx="321" cy="256" r="116" stroke="#f4f6f8" stroke-width="20"/>

  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#86d9c6"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
  </defs>
</svg>
